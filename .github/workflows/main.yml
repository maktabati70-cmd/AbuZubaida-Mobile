name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.7' }
      - name: Prepare project & signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          VC=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "VC=$VC" >> $GITHUB_ENV
          echo "VN=$VN" >> $GITHUB_ENV
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "Release key: OK"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - building with a temporary debug key"
          fi
      - name: Stamp UI version
        run: sed -i 's/content="UIVER"/content="${{ github.run_number }}"/' app/src/main/assets/index.html
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/abuzubaida-mobile-$VN.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AbuZubaida-Mobile-apk
          path: out/*.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VC }}
          name: مركز أبو زبيدة للجوال ${{ env.VN }}
          body: نسخة الجوال من مركز أبو زبيدة للتتبع والرصد.
          files: out/abuzubaida-mobile-${{ env.VN }}.apk
          make_latest: true
